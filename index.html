<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1 id="top">Colors!</h1>
  </header>

  <main>
    <h2>Basic Media Queries</h2>
    <p>In this assignment you will add two media queries to the css file.</p>

    <div class="container">
      <figure>
        <img src="Red.jpeg" alt="Red color sample">
        <figcaption>1. Red</figcaption>
      </figure>

      <figure>
        <img src="Orange.png" alt="Orange color sample">
        <figcaption>2. Orange</figcaption>
      </figure>

      <figure>
        <img src="Green.png" alt="Green color sample">
        <figcaption>3. Green</figcaption>
      </figure>

      <figure>
        <img src="Blue.png" alt="Blue color sample">
        <figcaption>4. Blue</figcaption>
      </figure>

      <figure>
        <img src="Indigo.jpeg" alt="Indigo color sample">
        <figcaption>5. Indigo</figcaption>
      </figure>

      <figure>
        <img src="Purple.png" alt="Purple color sample">
        <figcaption>6. Purple</figcaption>
      </figure>

      <figure>
        <img src="Pink.jpeg" alt="Pink color sample">
        <figcaption>7. Pink</figcaption>
      </figure>

      <figure>
        <img src="White.png" alt="White color sample">
        <figcaption>8. White</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <a href="#top">Jump to the Top</a>
  </footer>

</html>
